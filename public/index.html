<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU Rotating Triangle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      text-align: center;
    }
    h1 {
      color: #eee;
      margin-bottom: 20px;
      font-weight: 300;
    }
    canvas {
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .status {
      color: #888;
      margin-top: 15px;
      font-size: 14px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 16px;
      color: #ddd;
      text-align: left;
      font-size: 13px;
    }
    .control label {
      display: block;
      margin-bottom: 6px;
    }
    .control input {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WebGPU Rotating Triangle</h1>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="controls">
      <div class="control">
        <label for="light-x">Light X</label>
        <input id="light-x" type="range" min="-1" max="1" step="0.05" value="0.4">
      </div>
      <div class="control">
        <label for="light-y">Light Y</label>
        <input id="light-y" type="range" min="-1" max="1" step="0.05" value="0.8">
      </div>
      <div class="control">
        <label for="light-z">Light Z</label>
        <input id="light-z" type="range" min="-1" max="1" step="0.05" value="0.6">
      </div>
      <div class="control">
        <label for="light-intensity">Intensity</label>
        <input id="light-intensity" type="range" min="0" max="1.5" step="0.05" value="0.75">
      </div>
    </div>
    <p class="status" id="status">Initializing WebGPU...</p>
  </div>
  <script src="/js/main.js?v=20260225-1300"></script>
  <script>
    // Check WebGPU support
    if (!navigator.gpu) {
      document.getElementById('status').textContent = 
        'WebGPU is not supported in this browser. Try Chrome 113+ or Edge.';
      document.getElementById('status').style.color = '#ff6b6b';
    } else {
      drawing_exercises.core.init();
    }
  </script>
</body>
</html>
